<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--primary, #2856E0); text-decoration: none; }
    a:hover { color: var(--primary-hover, #1d3fae); text-decoration: underline; }
  </style>
</helmet>
<div style="--primary:{{accent}}; --primary-soft:color-mix(in oklch, var(--primary) 10%, white); --bg:oklch(97% 0.006 250); --surface:oklch(100% 0 0); --border:oklch(89% 0.008 250); --text:oklch(20% 0.02 255); --text-muted:oklch(52% 0.014 255); width:390px; min-height:844px; background:var(--bg); font-family:'Work Sans',system-ui,sans-serif; color:var(--text); display:flex; flex-direction:column;">

  <div style="flex:1; padding:28px 24px 12px 24px; display:flex; flex-direction:column; gap:24px;">

    <div style="display:flex; align-items:center; gap:14px;">
      <div style="width:36px; height:36px; border-radius:10px; background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </div>
      <div style="display:flex; align-items:center; gap:10px; min-width:0;">
        <div style="width:32px; height:32px; border-radius:9px; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; font-family:'Sora',sans-serif; font-weight:700; font-size:12px; flex-shrink:0;">BC</div>
        <span style="font-family:'Sora',sans-serif; font-weight:700; font-size:17px;">Loja Bela Cores</span>
      </div>
    </div>

    <div style="display:flex; flex-direction:column; align-items:center; gap:18px; padding-top:8px;">
      <div style="position:relative; width:200px; height:200px; display:flex; align-items:center; justify-content:center;">
        <svg viewBox="0 0 200 200" width="200" height="200" style="position:absolute; top:0; left:0; transform:rotate(-90deg);">
          <circle cx="100" cy="100" r="86" fill="none" stroke="var(--border)" stroke-width="14"/>
          <circle cx="100" cy="100" r="86" fill="none" stroke="var(--primary)" stroke-width="14" stroke-linecap="round" stroke-dasharray="{{ringDash}}" stroke-dashoffset="0"/>
        </svg>
        <div style="display:flex; flex-direction:column; align-items:center; gap:2px;">
          <span style="font-family:'Sora',sans-serif; font-weight:800; font-size:34px;">6/10</span>
          <span style="font-size:12.5px; color:var(--text-muted);">marcações</span>
        </div>
      </div>

      <div style="display:flex; align-items:center; gap:8px; background:var(--primary-soft); color:var(--primary); padding:10px 18px; border-radius:999px;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4"/><path d="M12 8v13M19 12v9H5v-9"/></svg>
        <span style="font-size:13px; font-weight:600;">Faltam 4 para: 1 esmalte grátis à sua escolha</span>
      </div>
    </div>

    <div style="background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:18px; display:flex; gap:12px;">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--text-muted)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; margin-top:1px;"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
      <p style="margin:0; font-size:13px; color:var(--text-muted); line-height:1.6;">Peça para a loja marcar sua compra ao pagar. Cada marcação conta para a sua próxima recompensa.</p>
    </div>
  </div>

  <div style="display:flex; border-top:1px solid var(--border); background:#fff; padding:12px 24px 20px 24px;">
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--primary);">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="2.5"/><path d="M2 10h20"/></svg>
      <span style="font-size:11px; font-weight:700;">Cartões</span>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--text-muted);">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span style="font-size:11px; font-weight:500;">Perfil</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#2856E0","options":["#2856E0","#0F766E","#7C3AED","#DC2626"]}}'>
class Component extends DCLogic {
  renderVals() {
    const radius = 86;
    const circumference = 2 * Math.PI * radius;
    const progress = 6 / 10;
    const dash = circumference * progress;
    const gap = circumference - dash;
    return {
      accent: this.props.accent ?? '#2856E0',
      ringDash: dash.toFixed(2) + ' ' + gap.toFixed(2)
    };
  }
}
</script>
</body>
</html>
