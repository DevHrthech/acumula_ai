<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--primary, #2856E0); text-decoration: none; }
    a:hover { color: var(--primary-hover, #1d3fae); text-decoration: underline; }
  </style>
</helmet>
<div style="--primary:{{accent}}; --primary-soft:color-mix(in oklch, var(--primary) 10%, white); --bg:oklch(97% 0.006 250); --surface:oklch(100% 0 0); --border:oklch(89% 0.008 250); --text:oklch(20% 0.02 255); --text-muted:oklch(52% 0.014 255); width:390px; min-height:844px; background:var(--bg); font-family:'Work Sans',system-ui,sans-serif; color:var(--text); display:flex; flex-direction:column; padding:28px 24px;">

  <div style="display:flex; align-items:center; gap:14px; margin-bottom:24px;">
    <div style="width:36px; height:36px; border-radius:10px; background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center;">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <span style="font-family:'Sora',sans-serif; font-weight:700; font-size:19px;">Criar conta</span>
  </div>

  <div style="display:flex; flex-direction:column; gap:14px;">
    <div style="display:flex; flex-direction:column; gap:6px;">
      <label style="font-size:13px; font-weight:600;">Nome completo</label>
      <input type="text" value="Marina Duarte" style="height:48px; border-radius:12px; border:1px solid var(--border); padding:0 14px; font-size:14px; font-family:inherit; color:var(--text); background:#fff;" />
    </div>
    <div style="display:flex; flex-direction:column; gap:6px;">
      <label style="font-size:13px; font-weight:600;">CPF</label>
      <input type="text" value="123.456.789-00" style="height:48px; border-radius:12px; border:1px solid var(--border); padding:0 14px; font-size:14px; font-family:inherit; color:var(--text); background:#fff;" />
    </div>
    <div style="display:flex; flex-direction:column; gap:6px;">
      <label style="font-size:13px; font-weight:600;">Telefone</label>
      <input type="text" value="(11) 91234-5678" style="height:48px; border-radius:12px; border:1px solid var(--border); padding:0 14px; font-size:14px; font-family:inherit; color:var(--text); background:#fff;" />
    </div>
    <div style="display:flex; flex-direction:column; gap:6px;">
      <label style="font-size:13px; font-weight:600;">Senha</label>
      <input type="text" value="••••••••••" style="height:48px; border-radius:12px; border:1px solid var(--border); padding:0 14px; font-size:14px; font-family:inherit; color:var(--text); background:#fff; letter-spacing:2px;" />
    </div>
    <div style="display:flex; flex-direction:column; gap:6px;">
      <label style="font-size:13px; font-weight:600;">Confirmar senha</label>
      <input type="text" value="••••••••••" style="height:48px; border-radius:12px; border:1px solid var(--border); padding:0 14px; font-size:14px; font-family:inherit; color:var(--text); background:#fff; letter-spacing:2px;" />
    </div>
  </div>

  <div style="flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:18px; padding-top:24px;">
    <button style="height:50px; border:none; border-radius:12px; background:var(--primary); color:#fff; font-family:inherit; font-weight:600; font-size:15px; cursor:pointer;">Criar conta</button>
    <p style="margin:0; text-align:center; font-size:13.5px; color:var(--text-muted);">Já tem conta? <a href="#" style="font-weight:700;">Entrar</a></p>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#2856E0","options":["#2856E0","#0F766E","#7C3AED","#DC2626"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2856E0' };
  }
}
</script>
</body>
</html>
