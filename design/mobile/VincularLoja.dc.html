<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--primary, #2856E0); text-decoration: none; }
    a:hover { color: var(--primary-hover, #1d3fae); text-decoration: underline; }
  </style>
</helmet>
<div style="--primary:{{accent}}; --primary-soft:color-mix(in oklch, var(--primary) 10%, white); --bg:oklch(97% 0.006 250); --surface:oklch(100% 0 0); --border:oklch(89% 0.008 250); --text:oklch(20% 0.02 255); --text-muted:oklch(52% 0.014 255); width:390px; min-height:844px; background:var(--bg); font-family:'Work Sans',system-ui,sans-serif; color:var(--text); display:flex; flex-direction:column; padding:28px 24px;">

  <div style="display:flex; align-items:center; gap:14px; margin-bottom:8px;">
    <div style="width:36px; height:36px; border-radius:10px; background:var(--surface); border:1px solid var(--border); display:flex; align-items:center; justify-content:center;">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <span style="font-family:'Sora',sans-serif; font-weight:700; font-size:19px;">Vincular a uma loja</span>
  </div>

  <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px;">
    <div style="position:relative; width:220px; height:220px; background:#111; border-radius:20px; overflow:hidden;">
      <div style="position:absolute; top:16px; left:16px; width:32px; height:32px; border-top:4px solid var(--primary); border-left:4px solid var(--primary); border-radius:6px 0 0 0;"></div>
      <div style="position:absolute; top:16px; right:16px; width:32px; height:32px; border-top:4px solid var(--primary); border-right:4px solid var(--primary); border-radius:0 6px 0 0;"></div>
      <div style="position:absolute; bottom:16px; left:16px; width:32px; height:32px; border-bottom:4px solid var(--primary); border-left:4px solid var(--primary); border-radius:0 0 0 6px;"></div>
      <div style="position:absolute; bottom:16px; right:16px; width:32px; height:32px; border-bottom:4px solid var(--primary); border-right:4px solid var(--primary); border-radius:0 0 6px 0;"></div>
      <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7l1.5-3h5L16 7"/><circle cx="12" cy="13.5" r="3.5"/></svg>
    </div>
    <p style="margin:0; text-align:center; font-size:14px; color:var(--text-muted); max-width:260px; line-height:1.5;">Aponte a câmera para o QR Code exposto na loja</p>
  </div>

  <div style="display:flex; align-items:center; gap:12px; margin:8px 0 20px 0;">
    <div style="flex:1; height:1px; background:var(--border);"></div>
    <span style="font-size:12.5px; color:var(--text-muted);">ou</span>
    <div style="flex:1; height:1px; background:var(--border);"></div>
  </div>

  <div style="display:flex; flex-direction:column; gap:10px;">
    <label style="font-size:13px; font-weight:600;">Código da loja</label>
    <input type="text" value="BELA-2K91" style="height:48px; border-radius:12px; border:1px solid var(--border); padding:0 14px; font-size:14px; font-family:inherit; color:var(--text); background:#fff; letter-spacing:1px;" />
    <button style="height:50px; border:none; border-radius:12px; background:var(--primary); color:#fff; font-family:inherit; font-weight:600; font-size:15px; cursor:pointer; margin-top:4px;">Vincular</button>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#2856E0","options":["#2856E0","#0F766E","#7C3AED","#DC2626"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2856E0' };
  }
}
</script>
</body>
</html>
