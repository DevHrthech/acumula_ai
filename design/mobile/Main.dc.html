<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--primary, #2856E0); text-decoration: none; }
    a:hover { color: var(--primary-hover, #1d3fae); text-decoration: underline; }
  </style>
</helmet>
<div style="--primary:{{accent}}; --primary-soft:color-mix(in oklch, var(--primary) 10%, white); --bg:oklch(97% 0.006 250); --surface:oklch(100% 0 0); --border:oklch(89% 0.008 250); --text:oklch(20% 0.02 255); --text-muted:oklch(52% 0.014 255); width:390px; min-height:844px; background:var(--bg); font-family:'Work Sans',system-ui,sans-serif; color:var(--text); display:flex; flex-direction:column;">

  <div style="flex:1; padding:28px 24px 12px 24px; display:flex; flex-direction:column; gap:20px;">

    <div style="display:flex; align-items:center; justify-content:space-between;">
      <div style="display:flex; flex-direction:column; gap:2px;">
        <span style="font-size:13px; color:var(--text-muted);">Olá, Marina</span>
        <h1 style="margin:0; font-family:'Sora',sans-serif; font-weight:700; font-size:22px;">Meus cartões</h1>
      </div>
      <div style="width:40px; height:40px; border-radius:999px; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; font-family:'Sora',sans-serif; font-weight:700; font-size:14px;">MD</div>
    </div>

    <div style="background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px; display:flex; flex-direction:column; gap:16px;">
      <div style="display:flex; align-items:center; gap:12px;">
        <div style="width:44px; height:44px; border-radius:12px; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; font-family:'Sora',sans-serif; font-weight:700; font-size:15px; flex-shrink:0;">BC</div>
        <div style="display:flex; flex-direction:column; gap:1px; min-width:0;">
          <span style="font-family:'Sora',sans-serif; font-weight:700; font-size:16px;">Loja Bela Cores</span>
          <span style="font-size:12.5px; color:var(--text-muted);">1 esmalte grátis à sua escolha</span>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:8px;">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <span style="font-size:12.5px; color:var(--text-muted); font-weight:500;">Progresso</span>
          <span style="font-size:12.5px; font-weight:700;">6 de 10</span>
        </div>
        <div style="width:100%; height:8px; border-radius:999px; background:var(--border); overflow:hidden;">
          <div style="width:60%; height:100%; background:var(--primary); border-radius:999px;"></div>
        </div>
      </div>
    </div>

    <div style="border:1.5px dashed var(--border); border-radius:16px; padding:18px; display:flex; align-items:center; gap:12px;">
      <div style="width:40px; height:40px; border-radius:10px; background:var(--bg); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      </div>
      <span style="font-size:13.5px; font-weight:600; color:var(--text);">Vincular nova loja</span>
    </div>
  </div>

  <div style="display:flex; border-top:1px solid var(--border); background:#fff; padding:12px 24px 20px 24px;">
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--primary);">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="2.5"/><path d="M2 10h20"/></svg>
      <span style="font-size:11px; font-weight:700;">Cartões</span>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--text-muted);">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span style="font-size:11px; font-weight:500;">Perfil</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#2856E0","options":["#2856E0","#0F766E","#7C3AED","#DC2626"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2856E0' };
  }
}
</script>
</body>
</html>
