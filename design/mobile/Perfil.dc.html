<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Work+Sans:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: var(--primary, #2856E0); text-decoration: none; }
    a:hover { color: var(--primary-hover, #1d3fae); text-decoration: underline; }
  </style>
</helmet>
<div style="--primary:{{accent}}; --primary-soft:color-mix(in oklch, var(--primary) 10%, white); --bg:oklch(97% 0.006 250); --surface:oklch(100% 0 0); --border:oklch(89% 0.008 250); --text:oklch(20% 0.02 255); --text-muted:oklch(52% 0.014 255); --danger:oklch(58% 0.19 25); width:390px; min-height:844px; background:var(--bg); font-family:'Work Sans',system-ui,sans-serif; color:var(--text); display:flex; flex-direction:column;">

  <div style="flex:1; padding:28px 24px 12px 24px; display:flex; flex-direction:column; gap:24px;">

    <h1 style="margin:0; font-family:'Sora',sans-serif; font-weight:700; font-size:22px;">Perfil</h1>

    <div style="display:flex; align-items:center; gap:14px;">
      <div style="width:64px; height:64px; border-radius:999px; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; font-family:'Sora',sans-serif; font-weight:700; font-size:20px; flex-shrink:0;">MD</div>
      <div style="display:flex; flex-direction:column; gap:2px;">
        <span style="font-family:'Sora',sans-serif; font-weight:700; font-size:18px;">Marina Duarte</span>
        <span style="font-size:13px; color:var(--text-muted);">CPF 123.456.789-00</span>
      </div>
    </div>

    <div style="background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden;">
      <div style="display:flex; align-items:center; gap:12px; padding:16px 18px; border-bottom:1px solid var(--border);">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="var(--text-muted)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
        <span style="flex:1; font-size:14px; font-weight:500;">Editar dados</span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
      <div style="display:flex; align-items:center; gap:12px; padding:16px 18px; border-bottom:1px solid var(--border);">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="var(--text-muted)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>
        <span style="flex:1; font-size:14px; font-weight:500;">Alterar senha</span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
      <div style="display:flex; align-items:center; gap:12px; padding:16px 18px;">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="var(--text-muted)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8h.01"/></svg>
        <span style="flex:1; font-size:14px; font-weight:500;">Sobre o ACUMULAAI</span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="var(--text-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    </div>

    <div style="display:flex; align-items:center; gap:12px; padding:16px 18px; border:1px solid var(--border); border-radius:16px; background:var(--surface);">
      <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="var(--danger)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      <span style="font-size:14px; font-weight:600; color:var(--danger);">Sair</span>
    </div>
  </div>

  <div style="display:flex; border-top:1px solid var(--border); background:#fff; padding:12px 24px 20px 24px;">
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--text-muted);">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="2.5"/><path d="M2 10h20"/></svg>
      <span style="font-size:11px; font-weight:500;">Cartões</span>
    </div>
    <div style="flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; color:var(--primary);">
      <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span style="font-size:11px; font-weight:700;">Perfil</span>
    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#2856E0","options":["#2856E0","#0F766E","#7C3AED","#DC2626"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#2856E0' };
  }
}
</script>
</body>
</html>
